name: Test Schedule Trigger

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  test-schedule:
    runs-on: ubuntu-latest
    steps:
      - name: Print Current Time and Context
        run: |
          echo "Current UTC Time:"
          date -u
          echo "Current Local Time (Asia/Shanghai):"
          TZ="Asia/Shanghai" date
          echo "Event Name: ${{ github.event_name }}"
          echo "Triggered Schedule: ${{ github.event.schedule }}"
