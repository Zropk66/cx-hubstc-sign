name: ChaoXing Auto Sign-in

on:
  schedule:
    # 每天北京时间 21:31 触发 (21:35 浮动的前沿)
    # 21:31 Beijing Time = 13:31 UTC
    - cron: '20 2 * * *'
  workflow_dispatch:
    inputs:
      custom_args:
        description: '自定义运行参数 (例如: --host xxx.chaoxing.com --device iPhone)'
        required: false
        default: ''

jobs:
  sign:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pycryptodome pillow loguru

      - name: Random Delay (Beijing Time 21:31 - 21:39)
        if: github.event_name == 'schedule'
        run: |
          python -c "
          import random
          import time
          delay = random.randint(0, 480)
          print(f'Random delay active: sleeping for {delay} seconds...')
          time.sleep(delay)
          print('Waking up, starting sign-in process.')
          "

      - name: Run Sign-in Script
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ ! -z "${{ github.event.inputs.custom_args }}" ]; then
            echo "Running with custom dispatcher args: ${{ github.event.inputs.custom_args }}"
            python sign.py ${{ github.event.inputs.custom_args }}
          else
            python sign.py
          fi

      - name: Commit and Push updated Cookies and Logs
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cookies.txt
          if [ -d "logs" ]; then
            git add logs/
          fi
          if ! git diff --cached --quiet; then
            echo "Changes detected (cookies or logs). Committing and pushing..."
            git commit -m "chore: auto-update cookies and logs [skip ci]"
            git push
          else
            echo "No changes to commit."
          fi
